# Static provisioning: a hand-made hostPath PV and a PVC that binds to it.
# Both must use storageClassName: manual (created by storage.tf). Data lands in
# ./.kind-storage/static/test-pv on the host.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: test-pv
  labels:
    app: pvc-test
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/test-pv
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: default
spec:
  storageClassName: manual
  volumeName: test-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: default
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - date >> /data/log.txt && cat /data/log.txt && sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: test-pvc
