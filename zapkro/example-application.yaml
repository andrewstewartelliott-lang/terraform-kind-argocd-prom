apiVersion: kro.run/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: zap-demo
spec:
  name: podinfo
  replicas: 1
  forceRedeployCounter: 1
  image:
    repository: ghcr.io/stefanprodan/podinfo
    tag: "6.11.1"
  httpPort: 9898
  command:
  - ./podinfo
  - --port=9898
  - --level=info
  zap:
    storageClassName: standard
    urls:
    - http://podinfo:9898
    excludePaths:
    - http://podinfo:9898/panic
    - http://podinfo:9898/status/10
    includePaths:
    - http://podinfo:9898.*
    openApi:
      apiFile: /zap/openapi/swagger.json
      targetUrl: http://podinfo:9898