---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: my-application
spec:
  schema:
    apiVersion: v1alpha1
    kind: Application
    spec:
      name: string | required=true
      image:
        repository: string | required=true
        tag: string | required=true
      replicas: integer | default=1
      command: "[]string"
      httpPort: integer | default=8080
      forceRedeployCounter: integer | default=0
      # Numeric user/group for the app container. Required because
      # runAsNonRoot can't verify images that use a named USER.
      runAsUser: integer | default=1000
      runAsGroup: integer | default=1000
      zap:
        storageClassName: string | required=true
        urls: "[]string | required=true"
        excludePaths: "[]string | default=[]"
        includePaths: "[]string | default=[]"
        openApi:
          apiUrl: string | default=""
          apiFile: string | default=""
          targetUrl: string | required=true
  resources:
    - id: deployment
      readyWhen:
        - ${deployment.status.availableReplicas > 0}
        - ${deployment.status.conditions.exists(c, c.type == "Available" &&
          c.status == "True")}
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}
          namespace: ${schema.metadata.namespace}
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app: ${schema.spec.name}
          template:
            metadata:
              labels:
                app: ${schema.spec.name}
                forceRedeployCounter: ${string(schema.spec.forceRedeployCounter)}
            spec:
              # Meets the Pod Security "restricted" profile.
              securityContext:
                runAsNonRoot: true
                runAsUser: ${schema.spec.runAsUser}
                runAsGroup: ${schema.spec.runAsGroup}
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: ${schema.spec.name}
                  image: ${schema.spec.image.repository}:${schema.spec.image.tag}
                  ports:
                    - name: http
                      containerPort: ${schema.spec.httpPort}
                      protocol: TCP
                  command: ${schema.spec.command}
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}
          namespace: ${schema.metadata.namespace}
        spec:
          selector: ${deployment.spec.selector.matchLabels}
          ports:
            - name: http
              port: ${schema.spec.httpPort}
              protocol: TCP
              targetPort: http
    - id: zapConfig
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          labels:
            app.kubernetes.io/name: zap
          name: ${schema.spec.name}-zap
          namespace: ${schema.metadata.namespace}
        data:
          af-plan.yaml: >
            env:
              contexts:
              - name: Default Context
                excludePaths: ${"[" + schema.spec.zap.excludePaths.map(item, '"' + item + '"').join(", ") + "]"}
                includePaths: ${"[" + schema.spec.zap.includePaths.map(item, '"' + item + '"').join(", ") + "]"}
                urls: ${"[" + schema.spec.zap.urls.map(item, '"' + item + '"').join(", ") + "]"}
              parameters:
                failOnError: false
                failOnWarning: false
            jobs:

            - name: openapi
              parameters:
                ${schema.spec.zap.openApi.apiFile != "" ? "apiFile: " + schema.spec.zap.openApi.apiFile : "apiUrl: " + schema.spec.zap.openApi.apiUrl}
                targetUrl: ${schema.spec.zap.openApi.targetUrl}
                context: Default Context
              type: openapi
            - name: activeScan
              parameters:
                context: Default Context
                policy: ""
                threadPerHost: 2
              policyDefinition:
                defaultStrength: medium
                defaultThreshold: medium
              type: activeScan
            - name: pdf-report
              parameters:
                reportDir: /zap/reports
                reportTitle: ZAP Scanning Report
                template: traditional-pdf
              risks:
              - info
              - low
              - medium
              - high
              confidences:
              - low
              - medium
              - high
              - confirmed
              sections:
              - instancecount
              - alertdetails
              - alertcount
              type: report
            - name: sarif-report
              parameters:
                template: sarif-json
                reportDir: /zap/reports
                reportTitle: ZAP Scanning Report
              risks:
              - low
              - medium
              - high
              confidences:
              - low
              - medium
              - high
              - confirmed
              type: report
    - id: zapPvc
      template:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          labels:
            app.kubernetes.io/name: zap
          name: ${schema.spec.name}-zap
          namespace: ${schema.metadata.namespace}
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Mi
          storageClassName: ${schema.spec.zap.storageClassName}
    - id: zapPod
      template:
        apiVersion: v1
        kind: Pod
        metadata:
          labels:
            app.kubernetes.io/name: zap
            dependency: ${deployment.metadata.name}
          name: ${schema.spec.name}-${schema.spec.image.tag}-zap-${string(schema.spec.forceRedeployCounter)}
          namespace: ${schema.metadata.namespace}
        spec:
          # Meets the Pod Security "restricted" profile. 1000 is the "zap"
          # user in ghcr.io/zaproxy/zaproxy; fsGroup lets it write reports
          # to the PVC.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - args:
                - ./zap.sh
                - -cmd
                - -autorun
                - /zap/config/af-plan.yaml
                - -host
                - 0.0.0.0
                - -config
                - api.disablekey=true
                - -config
                - api.addrs.addr.name=.*
                - -config
                - api.addrs.addr.regex=true
              image: ghcr.io/zaproxy/zaproxy:stable
              name: zaproxy
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              ports:
                - containerPort: 8080
                  name: zaproxy
                  protocol: TCP
              startupProbe:
                failureThreshold: 3
                httpGet:
                  path: /
                  port: 8080
                  scheme: HTTP
                initialDelaySeconds: 60
                periodSeconds: 10
                successThreshold: 1
                timeoutSeconds: 3
              volumeMounts:
                - mountPath: /zap/config
                  name: config
                - mountPath: /zap/reports
                  name: pvc
                - mountPath: /zap/openapi
                  name: openapi
          restartPolicy: Never
          volumes:
            - name: config
              configMap:
                name: ${zapConfig.metadata.name}
            - name: pvc
              persistentVolumeClaim:
                claimName: ${zapPvc.metadata.name}
            - name: openapi
              configMap:
                name: ${schema.spec.name}-openapi
                optional: true